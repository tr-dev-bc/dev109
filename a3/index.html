<!DOCTYPE html>
<html>
<head>
    <meta name="description" content="Week 6 - BC - Rhombus">
    <meta charset="utf-8">
    <title>JS Bin</title>
</head>
<body>
    <label>What is the size of Rhombus?</label><br>
    <input type="text" id="rHeight" value="5" size="5">
    <br>
    <label>Choose color for Even position</label><br>
    <select id="colorEven">
        <option value="#8A2BE2">Electric Purple</option>
        <option value="#FF00FF">Magenta</option>
        <option value="#00FFFF">Cyan</option>
    </select><br>
    
    <label>Choose color for Odd position</label><br>
    <select id="colorOdd">
        <option value="#FF1493">Neon Pink</option>
        <option value="#00FF7F">Neon Green</option>
        <option value="#FFD700">Bright Gold</option>
    </select><br>

    <label>Choose symbol for Rhombus</label>
    <select id="symbol">
        <option value="#">*</option>
        <option value="+">$</option>
        <option value="+">@</option>
    </select><br>
    
    <button onclick="createRhombus(
        document.getElementById('rHeight').value,
        document.getElementById('colorEven').value,
        document.getElementById('colorOdd').value,
        document.getElementById('symbol').value
    );">Display Rhombus</button>
    
    <p>Your Rhombus:</p>
    <div class="rhombus-container">
        <div id="upLeft" class="rhombus-quadrant"></div>
        <div id="upRight" class="rhombus-quadrant"></div>
        <div id="downLeft" class="rhombus-quadrant"></div>
        <div id="downRight" class="rhombus-quadrant"></div>
    </div>

    <!-- CALL YOUR JAVASCRIPT FILE IF YOU ARE USING A HOSTING ENVIRONMENT -->
    <script src="rhombus.js"></script>
</body>
</html>
